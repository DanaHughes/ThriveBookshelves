/* ---------- arranging the shelf ----------
   Students can drag books and plants to any spot on any shelf (mouse, finger,
   stylus; on touch screens press and hold a book for a moment first), or focus
   a piece and use the arrow keys. Each piece snaps onto a shelf and slides to
   the nearest open spot so nothing overlaps. The arrangement is saved per
   grade and course, locally and (when connected) in Supabase. */
const layoutKey = data => `layout:${state.gradeId}|${data.courseId || 'explore'}`;
const getLayout = data => storage.get(layoutKey(data)) || {};
function saveSpot(data, pieceId, spot) { const l = getLayout(data); l[pieceId] = spot; storage.set(layoutKey(data), l); }

function boardTops(body) { return [...body.querySelectorAll('.case-board')].map(b => b.offsetTop + b.parentElement.offsetTop); }
// Spaces on a shelf already taken by other pieces, in px from the left.
function takenOnShelf(body, shelf, except) {
  const out = [];
  body.querySelectorAll('.piece').forEach(pc => {
    if (pc !== except && pc.dataset.shelf !== undefined && +pc.dataset.shelf === shelf) out.push([pc.offsetLeft - 8, pc.offsetLeft + pc.offsetWidth + 8]);
  });
  return out;
}
// Nearest open spot to x on this shelf, or null if the shelf is full.
function freeX(body, el, shelf, x) {
  const w = el.offsetWidth, maxX = body.clientWidth - w, taken = takenOnShelf(body, shelf, el);
  const fits = v => v >= 0 && v <= maxX && taken.every(([a, b]) => v + w <= a || v >= b);
  const candidates = [Math.max(0, Math.min(maxX, x)), 0, maxX, ...taken.flatMap(([a, b]) => [a - w, b])].filter(fits);
  if (!candidates.length) return null;
  return candidates.reduce((best, v) => Math.abs(v - x) < Math.abs(best - x) ? v : best);
}
function placePiece(el, body, spot) {
  const tops = boardTops(body);
  delete el.dataset.shelf;
  let shelf = Math.max(0, Math.min(tops.length - 1, spot.shelf));
  const maxX = Math.max(0, body.clientWidth - el.offsetWidth);
  let x = freeX(body, el, shelf, spot.x * maxX);
  if (x === null) {                     // shelf is full: use the closest shelf with room
    const order = tops.map((_, i) => i).sort((a, b) => Math.abs(a - shelf) - Math.abs(b - shelf));
    for (const i of order) { const v = freeX(body, el, i, spot.x * maxX); if (v !== null) { shelf = i; x = v; break; } }
    if (x === null) x = Math.max(0, Math.min(maxX, spot.x * maxX));
  }
  el.style.left = Math.round(x) + 'px';
  el.style.top = (tops[shelf] - el.offsetHeight + (el.classList.contains('plant') ? 3 : 0)) + 'px';
  el.dataset.shelf = shelf;
  return { shelf, x: maxX > 0 ? Math.round(x / maxX * 1000) / 1000 : 0 };
}

function layoutBookcase(id) {
  const root = document.getElementById(id), data = CASES.get(id);
  if (!root || !data) return;
  const body = root.querySelector('.bookcase__body');
  const small = window.innerWidth <= 760;
  const inner = body.clientWidth - (small ? 32 : 60);
  if (inner <= 0) return;
  const gap = small ? 12 : 18;
  const per = Math.max(2, Math.floor((inner + gap) / (140 + gap)));
  let bw = Math.min(160, Math.floor((inner - gap * (per - 1)) / per));
  // Default order: books facing out first, finished books (spines) after.
  const items = data.books.map(b => ({ book: b, spine: data.context === 'course' && isDone(data.courseId, b.key) }));
  items.sort((a, b) => a.spine - b.spine);
  const pack = w0 => {
    const out = []; let row = [], used = 0;
    items.forEach(it => {
      const w = it.spine ? 50 : w0;
      if (row.length && used + gap + w > inner) { out.push(row); row = []; used = 0; }
      used += (row.length ? gap : 0) + w; row.push(it);
    });
    if (row.length) out.push(row);
    const n = out.length;
    while (out.length < Math.max(2, n + 1)) out.push([]);   // always one shelf with open space
    return out;
  };
  let rows = pack(bw);
  // On a computer, shrink the books until every shelf fits on the screen without scrolling.
  if (!small) {
    const top = body.getBoundingClientRect().top + window.scrollY;
    const avail = Math.max(300, window.innerHeight - top - 64);
    for (let k = 0; k < 6; k++) {
      const fit = Math.floor((avail / rows.length - 67) * 0.75);
      if (bw <= fit || bw <= 96) break;
      bw = Math.max(96, fit);
      rows = pack(bw);
    }
  }
  root.style.setProperty('--bw', bw + 'px');
  const bookH = Math.round(bw * 4 / 3);
  body.innerHTML = rows.map(r => `<div class="case-row"><div class="case-row__items">${r.map(it => it.spine ? spineHtml(it.book, data) : faceOutHtml(it.book, data)).join('')}</div>
      <div class="case-board" aria-hidden="true"><i class="case-top"></i><i class="case-lip"></i></div></div>`).join('');

  // Every book and plant becomes a movable piece.
  const br = body.getBoundingClientRect(), pieces = [];
  body.querySelectorAll('.case-item').forEach(el => {
    const r = el.getBoundingClientRect(), maxX = Math.max(1, body.clientWidth - r.width);
    const shelf = [...body.querySelectorAll('.case-row')].indexOf(el.closest('.case-row'));
    pieces.push({ el, id: 'book:' + el.dataset.item, def: { shelf, x: (r.left - br.left) / maxX }, w: r.width, h: r.height });
  });
  PLANTS.forEach(pl => {
    const h = Math.round(bookH * pl.h), w = Math.round(h * pl.ratio);
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'plant';
    el.setAttribute('aria-label', `${pl.name}. Drag it, or use the arrow keys, to move it to another spot.`);
    el.innerHTML = `<img src="${pl.src}" alt="" draggable="false">`;
    pieces.push({ el, id: 'plant:' + pl.id, def: { shelf: pl.shelf, x: pl.x }, w, h });
  });
  pieces.forEach(pc => {
    pc.el.classList.add('piece'); pc.el.dataset.piece = pc.id; pc.el.dataset.case = id;
    pc.el.style.width = pc.w + 'px'; pc.el.style.height = pc.h + 'px';
    body.appendChild(pc.el);
  });
  const saved = getLayout(data);
  [...pieces.filter(pc => saved[pc.id]), ...pieces.filter(pc => !saved[pc.id])]
    .forEach(pc => placePiece(pc.el, body, saved[pc.id] || pc.def));
}

// Dragging. Mouse and pen drag right away; on touch screens a book needs a short
// press-and-hold first so students can still scroll the page with a swipe.
let drag = null, suppressClick = false;
function pieceCase(el) { const id = el.dataset.case; return { id, data: CASES.get(id), body: el.parentElement }; }
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.piece'); if (!el || state.book) return;
  const r = el.getBoundingClientRect();
  drag = { el, pointerId: e.pointerId, sx: e.clientX, sy: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top, active: false, holdOk: true };
  if (e.pointerType === 'touch' && !el.classList.contains('plant')) {
    drag.holdOk = false;
    drag.timer = setTimeout(() => { if (drag && drag.el === el) { drag.holdOk = true; startDrag(); } }, 350);
  } else if (el.classList.contains('plant')) { e.preventDefault(); }
});
function startDrag() {
  if (!drag || drag.active) return;
  drag.active = true;
  try { drag.el.setPointerCapture(drag.pointerId); } catch (err) { /* ignore */ }
  drag.el.classList.add('is-dragging');
}
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pointerId) return;
  const far = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6;
  if (!drag.active) {
    if (!drag.holdOk) { if (far) { clearTimeout(drag.timer); drag = null; } return; }   // it was a scroll
    if (!far) return;
    startDrag();
  }
  const { el, dx, dy } = drag, body = el.parentElement, br = body.getBoundingClientRect();
  el.style.left = Math.round(Math.max(0, Math.min(body.clientWidth - el.offsetWidth, e.clientX - br.left - dx))) + 'px';
  el.style.top = Math.round(e.clientY - br.top - dy) + 'px';
});
document.addEventListener('touchmove', e => { if (drag && drag.active) e.preventDefault(); }, { passive: false });
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null; clearTimeout(d.timer);
  if (!d.active) return;
  const el = d.el, { data, body } = pieceCase(el);
  el.classList.remove('is-dragging');
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  const bottom = el.offsetTop + el.offsetHeight, tops = boardTops(body);
  let shelf = 0; tops.forEach((t, i) => { if (Math.abs(t - bottom) < Math.abs(tops[shelf] - bottom)) shelf = i; });
  const maxX = Math.max(1, body.clientWidth - el.offsetWidth);
  const spot = placePiece(el, body, { shelf, x: el.offsetLeft / maxX });
  if (data) saveSpot(data, el.dataset.piece, spot);
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', () => { if (drag) { clearTimeout(drag.timer); if (drag.active) endDrag(); else drag = null; } });
// A drag should never also open the book.
document.addEventListener('click', e => { if (suppressClick && e.target.closest('.piece')) { e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);
// Keyboard: arrow keys move the focused book or plant.
document.addEventListener('keydown', e => {
  if (state.book) return;
  const el = e.target.closest && e.target.closest('.piece'); if (!el) return;
  const moves = { ArrowLeft: [0, -.08], ArrowRight: [0, .08], ArrowUp: [-1, 0], ArrowDown: [1, 0] };
  if (!(e.key in moves)) return;
  e.preventDefault();
  const { data, body } = pieceCase(el);
  const maxX = Math.max(1, body.clientWidth - el.offsetWidth);
  const cur = { shelf: +el.dataset.shelf, x: el.offsetLeft / maxX };
  const next = { shelf: Math.max(0, cur.shelf + moves[e.key][0]), x: Math.max(0, Math.min(1, cur.x + moves[e.key][1])) };
  const spot = placePiece(el, body, next);
  if (data) saveSpot(data, el.dataset.piece, spot);
  el.focus();
});

// Card states: done (earlier this week), today, today-done (finished today), ahead (later this week).
function weekState(book) {
  const days = book.week.length, wk = weekCount(state.courseId, book.key), today = isDone(state.courseId, book.key);
  const ti = today ? wk - 1 : wk;

// later = true draws a later week: every card is a quiet "look ahead" card.
function weekCardsHtml(book, later) {

    else if (ws.allDone || i < ws.ti) st = 'done';
    else if (i === ws.ti) st = ws.today ? 'today-done' : 'today';
    const items = (d.links || []).map(x => ({ it:book.items[x], min:Number((d.minutes || {})[x]) || 0 })).filter(x => x.it);
    const buttons = again => items.map((x, k) => weekButtonHtml(x.it, again, items.length === 1, k, x.min)).join('');

function buildPages(book, contextLabel) {

    const info = el(`<div class="page"><div class="page-inner">

    const S = window.ThriveSeed, cal = (CUR && CUR.calendar) || S.CALENDAR, thisMon = S.dayKey(S.mondayOf(new Date()));

    const range = mon => { const a = S.parseDay(mon), b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 4);

    const weeks = S.schoolWeeks(cal, new Date());
    const onePage = window.matchMedia('(max-width: 720px)').matches;

      <div class="page-foot">${++n}</div>
    </div></div>`);
    const artPage = (mon, k) => {
      const a = S.parseDay(mon), next = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 7);
      const brk = (cal.breaks || []).find(b => next >= S.mondayOf(S.parseDay(b.from)) && next <= S.parseDay(b.to));
      const back = brk && weeks.find(w => S.parseDay(w) > next);
      const quarter = (cal.quarters || []).some(q => S.dayKey(S.mondayOf(S.parseDay(q.from))) === mon);
      return el(`<div class="page"><div class="page-inner page-inner--art">
      <p class="eyebrow">${esc(T('weekOf', { dates: range(mon) }))}</p>

    <h2>${esc(book.title)}</h2>

/* =========================================================
   H. FALLBACK READER (only if the page-flip CDN is unavailable)
   ========================================================= */
class SimpleBook {
  constructor(host, pages) {
    this.pages = pages; this.i = 0; this.handlers = {};
    this.el = document.createElement('div'); this.el.className = 'simple-book';
    pages.forEach((p, idx) => { p.classList.add('simple-page'); p.hidden = idx !== 0; this.el.appendChild(p); });
    host.appendChild(this.el);
  }
  on(evt, cb) { (this.handlers[evt] = this.handlers[evt] || []).push(cb); return this; }
  getCurrentPageIndex() { return this.i; }
  getPageCount() { return this.pages.length; }
  getOrientation() { return 'portrait'; }
  getState() { return 'read'; }
  show(n) {
    n = Math.max(0, Math.min(this.pages.length - 1, n));
    if (n === this.i) return;
    this.pages[this.i].hidden = true;
    this.pages[n].classList.toggle('from-left', n < this.i);
    this.pages[n].hidden = false;
    this.i = n;
    (this.handlers.flip || []).forEach(cb => cb({ data: n }));
  }
  flipNext() { this.show(this.i + 1); }
  flipPrev() { this.show(this.i - 1); }
  turnToPage(n) { this.show(n); }
  destroy() { this.el.remove(); }
}

   I. OPEN / CLOSE A BOOK
   ========================================================= */
function openBook(key, context, trigger) {
  const grade = currentGrade();
  let book, label;
  if (context === 'course') {
    const course = coursesFor(grade).find(c => c.id === state.courseId);
    book = course && course.books.find(b => b.key === key); label = course ? course.name : '';
  } else {
    book = extraBooks(grade.n).find(b => b.key === key); label = T('courseExploreName');
  }
  if (!book || state.book) return;
  stopReading();
  state.book = book; state.returnFocus = trigger; state.lastBookKey = key;
  dom.title.textContent = book.title;
  dom.sub.textContent = `${label} · ${grade.label}`;
  dom.backLabel.textContent = context === 'course' ? `Back to ${label}` : `Back to ${T('courseExploreName')}`;
  state.bookContext = context;
  $('#doneGroup').hidden = $('#topWeekGoal').hidden = context !== 'course';
  if (context === 'course') updateDoneBtn();
  dom.reader.hidden = false;
  dom.app.setAttribute('aria-hidden', 'true');
  document.body.classList.add('reader-open');

  requestAnimationFrame(() => {
    dom.reader.classList.add('is-open');
    const pages = buildPages(book, label);
    const stop = e => e.stopPropagation();   // presses on links and buttons never start a page turn
    pages.forEach(p => p.querySelectorAll('.no-flip').forEach(z =>
      ['mousedown', 'touchstart', 'pointerdown'].forEach(t => z.addEventListener(t, stop, { passive: true }))));
    if (HAS_FLIP) {
      const bookEl = document.createElement('div');
      bookEl.className = 'flipbook';
      dom.host.appendChild(bookEl);
      state.flip = new St.PageFlip(bookEl, {
        width: 520, height: 680, size: 'stretch', minWidth: 280, maxWidth: 620, minHeight: 360, maxHeight: 820,
        showCover: false, usePortrait: true, autoSize: true, drawShadow: true, maxShadowOpacity: 0.3,
        flippingTime: REDUCED_MOTION ? 250 : 700, useMouseEvents: true, clickEventForward: true,
        disableFlipByClick: true, showPageCorners: false, mobileScrollSupport: true, swipeDistance: 40
      });
      state.flip.loadFromHTML(pages);
      state.flip.on('changeOrientation', updateUI);
    } else {
      state.flip = new SimpleBook(dom.host, pages);
    }
    state.flip.on('flip', updateUI);
    if (state.bookContext === 'course') updateDoneBtn();   // fill in the week goal and status on the page
    updateUI();
    dom.back.focus();
    setTimeout(waveMascot, 450);   // after the book has opened and laid out its pages
  });
}
function closeBook() {
  if (!state.book) return;
  stopReading();
  dom.reader.classList.remove('is-open');
  document.body.classList.remove('reader-open');
  dom.app.removeAttribute('aria-hidden');
  setTimeout(() => {
    if (state.flip) { try { state.flip.destroy(); } catch (e) { /* ignore */ } }
    state.flip = null; state.book = null;
    dom.host.innerHTML = '';
    dom.reader.hidden = true;
    const key = state.lastBookKey;
    if (state.view === 'course') renderCourse();
    const again = key && document.querySelector(`[data-book="${key}"]`);
    if (again) again.focus(); else if (state.returnFocus && document.body.contains(state.returnFocus)) state.returnFocus.focus();
  }, REDUCED_MOTION ? 0 : 240);
}
dom.back.addEventListener('click', leaveBook);
function updateDoneBtn() {
  const on = !!state.book && isDone(state.courseId, state.book.key);
  $('#doneBtn').setAttribute('aria-pressed', String(on));

   A link opens inside this page when its website allows embedding.
   Sites that refuse embedding (Lexia, ALEKS, Essentials in Writing, edclub,
   claude.ai artifacts all send X-Frame-Options) open in a smaller window

const EMBEDDABLE_HOSTS = ['danahughes.github.io'];
function canEmbed(url) {

function openWindowOnTop(url, name, label) {

  const baseY = window.screenY != null ? window.screenY : (screen.availTop || 0);
  const outerW = window.outerWidth || aw, outerH = window.outerHeight || ah;
  const left = Math.max(0, Math.round(baseX + (outerW - w) / 2)), top = Math.max(0, Math.round(baseY + (outerH - h) / 2));
  const win = window.open(url, name, `popup=yes,width=${w},height=${h},left=${left},top=${top}`);
  if (!win) { toast(`Your browser blocked the ${label} window. Allow pop-ups for this page, then try again.`); return; }
  try { win.opener = null; win.focus(); } catch (e) { /* cross-origin, fine */ }
}
const viewer = { el: $('#viewer'), frame: $('#viewerFrame'), title: $('#viewerTitle'), url: null, label: '', returnFocus: null };
function openViewer(url, label, trigger) {
  viewer.url = url; viewer.label = label; viewer.returnFocus = trigger;
  viewer.title.textContent = label;
  viewer.frame.innerHTML = '';
  const f = document.createElement('iframe');
  f.src = url; f.title = label;
  f.setAttribute('allow', 'fullscreen; clipboard-write; encrypted-media; picture-in-picture');
  f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  viewer.frame.appendChild(f);
  viewer.el.hidden = false;
  requestAnimationFrame(() => viewer.el.classList.add('is-open'));
  $('#viewerClose').focus();
}
function closeViewer() {
  if (viewer.el.hidden) return false;
  viewer.el.classList.remove('is-open');
  setTimeout(() => { viewer.el.hidden = true; viewer.frame.innerHTML = ''; }, REDUCED_MOTION ? 0 : 200);
  if (viewer.returnFocus) viewer.returnFocus.focus();
  return true;
}
$('#viewerClose').addEventListener('click', closeViewer);
$('#viewerPop').addEventListener('click', () => { const u = viewer.url, l = viewer.label; closeViewer(); openWindowOnTop(u, 'thrive-link', l); });
viewer.el.addEventListener('click', e => { if (e.target === viewer.el) closeViewer(); });
function openLink(url, label, trigger) {
  if (canEmbed(url)) openViewer(url, label, trigger);
  else openWindowOnTop(url, 'thrive-link', label);
}
dom.reader.addEventListener('click', e => {
  const l = e.target.closest('[data-launch]');
  if (l) { const app = APPS[l.dataset.launch]; if (app) openWindowOnTop(app.url, app.windowName || 'thrive-app', app.name); return; }
  const o = e.target.closest('[data-open-url]');
  if (o) openLink(o.dataset.openUrl, o.dataset.openTitle, o);
});

/* =========================================================
   K. NAVIGATION INSIDE A BOOK
   ========================================================= */
function go(dir) {
  const f = state.flip; if (!f) return;
  const before = f.getCurrentPageIndex();
  if (dir > 0) f.flipNext(); else f.flipPrev();
  // Failsafe: in one-page layouts the animated turn can silently do nothing; turn directly instead.
  if (HAS_FLIP) setTimeout(() => {
    if (state.flip === f && f.getState() === 'read' && f.getCurrentPageIndex() === before) {
      const target = before + dir;
      if (target >= 0 && target < f.getPageCount()) { f.turnToPage(target); updateUI(); }
    }
  }, (REDUCED_MOTION ? 250 : 700) + 250);
}
dom.prev.addEventListener('click', () => go(-1));
dom.next.addEventListener('click', () => go(1));
function updateUI() {
  const f = state.flip; if (!f) return;
  const i = f.getCurrentPageIndex(), n = f.getPageCount(), land = f.getOrientation() === 'landscape';
  dom.prev.disabled = i <= 0;
  dom.next.disabled = land ? i + 2 >= n : i >= n - 1;
  dom.indicator.textContent = land ? `Pages ${i + 1}–${Math.min(i + 2, n)} of ${n}` : `Page ${i + 1} of ${n}`;
}
document.addEventListener('keydown', e => {
  if (!state.book) return;
  if (e.key === 'Escape') { e.preventDefault(); if (!closeViewer()) closeBook(); return; }
  if (!viewer.el.hidden) {
    if (e.key === 'Tab') {
      const items = [...viewer.el.querySelectorAll('button, iframe')];
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    return;
  }
  if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  if (e.key === 'Tab') {
    const items = [...dom.reader.querySelectorAll('button:not(:disabled), a[href]')].filter(n => n.offsetParent !== null);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* =========================================================
   L. TOAST + START
   ========================================================= */
let toastTimer = null;
function toast(msg) {
  dom.toast.textContent = msg;
  dom.toast.classList.add('is-visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => dom.toast.classList.remove('is-visible'), 3200);
}
(function setupShell() {
  if (params.get('embed') === '1') document.body.classList.add('is-embedded');   // hides the sidebar inside the portal
  applyShellText();
  $('#helloDate').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  document.querySelectorAll('#portalNav [data-nav]').forEach(a => {
    const url = PORTAL_LINKS[a.dataset.nav];
    if (url) a.href = url;
    else { a.classList.add('is-unavailable'); a.setAttribute('aria-disabled', 'true'); a.title = 'Open this page from the Thrive Academy portal'; }
  });
})();
function refreshCurrentView() { if (!state.book) showView(state.view); }
function applyShellText() {
  const st = activeStudent();
  const name = ((params.get('name') || '').trim() || (st ? st.name.split(' ')[0] : '')).slice(0, 40);
  if (name) $('#helloTitle').textContent = T('greeting', { name });
  const ex = T('courseExploreName');
  $('#subjectsTitle').textContent = ex;
  const nav = document.querySelector('.nav-item[data-view="subjects"]');
  if (nav && nav.lastChild && nav.lastChild.nodeType === 3) nav.lastChild.textContent = ex;
}
// Edits saved in the Curriculum tab show up here right away (same site, same browser).
window.addEventListener('storage', e => {
  if (e.key !== CURRICULUM_KEY) return;
  CUR = loadCurriculum() || window.ThriveSeed.buildSeed(); applyCurriculumApps(); applyShellText();
  if (!state.book) { if (state.view === 'course' && !coursesFor(currentGrade()).some(c => c.id === state.courseId)) state.view = 'today'; refreshCurrentView(); }
});
renderGradeTabs();
cloudInit();
showView(['explore', 'subjects'].includes(params.get('view')) ? 'subjects' : 'today');
if (!HAS_FLIP) console.warn('page-flip library not loaded; using the simple reader.');
})();
</script>
